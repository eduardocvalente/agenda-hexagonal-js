# fly.toml app configuration file generated for cadastro-usuario on 2026-07-31T17:27:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cadastro-usuario'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  COOKIE_SECURE = 'true'
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'
  PORT = '3000'
  TRUST_PROXY_HOPS = '1'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
