name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo branch — economiza minutos de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.11.0'

jobs:
  quality:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Testes
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/cadastro_test
      SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789
      BCRYPT_ROUNDS: '4'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # mongodb-memory-server baixa um binário próprio; o cache evita o download
      # a cada execução (~100 MB).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm run test:coverage
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  dependencies:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Bloqueia o merge em vulnerabilidade high/critical. moderate vira aviso.
      - name: npm audit (bloqueante em high/critical)
        run: npm audit --audit-level=high
      - name: npm audit (informativo)
        if: always()
        run: npm audit --audit-level=moderate || true
      - name: Gerar SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  docker:
    name: Build e scan da imagem
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cadastro-usuario:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cadastro-usuario:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Falhar em vulnerabilidade CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cadastro-usuario:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      # Smoke test do container antes de considerar a imagem publicável.
      - name: Smoke test do container
        run: |
          docker network create smoke
          docker run -d --name mongo --network smoke mongo:7.0
          docker run -d --name app --network smoke -p 3000:3000 \
            -e MONGODB_URI=mongodb://mongo:27017/smoke \
            -e SESSION_SECRET=smoke-only-secret-0123456789abcdef01234567 \
            -e COOKIE_SECURE=false \
            cadastro-usuario:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/readyz; then echo "OK"; exit 0; fi
            sleep 2
          done
          echo "readiness nunca ficou verde"; docker logs app; exit 1
