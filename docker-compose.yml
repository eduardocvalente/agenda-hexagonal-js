# Stack base — aproxima o ambiente local do de produção.
# Sobreposições ficam em docker-compose.override.yml (aplicado automaticamente
# em `docker compose up`) e docker-compose.test.yml.

name: cadastro-usuario

services:
  app:
    build:
      context: .
      target: runtime
    image: cadastro-usuario:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      MONGODB_URI: mongodb://app:${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD}@mongo:27017/cadastro_usuario?authSource=admin
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET (openssl rand -hex 32)}
      COOKIE_SECURE: 'false'
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: '0'
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Sem limites, um vazamento na aplicação consome a máquina inteira.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ['--bind_ip_all']
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD}
      MONGO_INITDB_DATABASE: cadastro_usuario
    volumes:
      - mongo-data:/data/db
    # Não publica porta por padrão: o banco só é alcançável pela rede do compose.
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mongo-data:
