<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="seta-tracejada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Fundo -->
  <rect x="0" y="0" width="960" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="38" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Arquitetura Hexagonal — Ports &amp; Adapters</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">Toda dependência aponta para o domínio. Nenhum framework atravessa a fronteira.</text>

  <!-- Cliente -->
  <rect x="30" y="130" width="130" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Navegador</text>
  <text x="95" y="175" text-anchor="middle" font-size="11" fill="#64748b">HTTPS</text>

  <!-- Presentation -->
  <rect x="200" y="90" width="180" height="150" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="290" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">presentation/http</text>
  <text x="290" y="137" text-anchor="middle" font-size="11" fill="#0c4a6e">controllers · presenters</text>
  <text x="290" y="154" text-anchor="middle" font-size="11" fill="#0c4a6e">middlewares (CSRF, CSP,</text>
  <text x="290" y="171" text-anchor="middle" font-size="11" fill="#0c4a6e">rate limit, cancelamento)</text>
  <text x="290" y="188" text-anchor="middle" font-size="11" fill="#0c4a6e">views EJS · rotas</text>
  <text x="290" y="215" text-anchor="middle" font-size="10" font-style="italic" fill="#0369a1">adaptador de entrada</text>

  <!-- Application -->
  <rect x="420" y="90" width="180" height="150" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="510" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">application</text>
  <text x="510" y="137" text-anchor="middle" font-size="11" fill="#4c1d95">9 casos de uso</text>
  <text x="510" y="154" text-anchor="middle" font-size="11" fill="#4c1d95">Result + AbortSignal</text>
  <text x="510" y="171" text-anchor="middle" font-size="11" fill="#4c1d95">DTOs · ServicoDeAuditoria</text>
  <text x="510" y="188" text-anchor="middle" font-size="11" fill="#4c1d95">porta: Logger</text>
  <text x="510" y="215" text-anchor="middle" font-size="10" font-style="italic" fill="#6d28d9">orquestração, sem regra</text>

  <!-- Domain -->
  <rect x="640" y="78" width="200" height="174" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="740" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">domain</text>
  <text x="740" y="126" text-anchor="middle" font-size="11" fill="#14532d">entidades: Usuario, Contato,</text>
  <text x="740" y="142" text-anchor="middle" font-size="11" fill="#14532d">RegistroDeAuditoria</text>
  <text x="740" y="160" text-anchor="middle" font-size="11" fill="#14532d">6 value objects</text>
  <text x="740" y="177" text-anchor="middle" font-size="11" fill="#14532d">portas: repositórios, hash</text>
  <text x="740" y="194" text-anchor="middle" font-size="11" fill="#14532d">invariantes de autorização</text>
  <text x="740" y="226" text-anchor="middle" font-size="10" font-style="italic" fill="#15803d">zero dependências externas</text>

  <!-- Infrastructure -->
  <rect x="420" y="300" width="420" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="630" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">infrastructure</text>
  <text x="630" y="347" text-anchor="middle" font-size="11" fill="#78350f">MongooseUsuarioRepository · MongooseContatoRepository · MongooseAuditoriaRepository</text>
  <text x="630" y="364" text-anchor="middle" font-size="11" fill="#78350f">BcryptServicoDeHash · PinoLogger · config validada no boot</text>
  <text x="630" y="381" text-anchor="middle" font-size="11" fill="#78350f">container de injeção de dependências (composition root)</text>
  <text x="630" y="406" text-anchor="middle" font-size="10" font-style="italic" fill="#b45309">adaptadores de saída — implementam as portas do domínio</text>

  <!-- MongoDB -->
  <path d="M 55 360 v 52 a 55 14 0 0 0 110 0 v -52" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="110" cy="360" rx="55" ry="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">MongoDB</text>

  <!-- Shared -->
  <rect x="200" y="452" width="640" height="58" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="520" y="476" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">shared</text>
  <text x="520" y="494" text-anchor="middle" font-size="11" fill="#475569">Result · hierarquia de erros (12 classes) · cancelamento cooperativo · ContextoDeExecucao (AsyncLocalStorage) · RegexCatalog · guards</text>

  <!-- Setas de fluxo -->
  <line x1="160" y1="162" x2="196" y2="162" stroke="#334155" stroke-width="1.6" marker-end="url(#seta)"/>
  <line x1="380" y1="162" x2="416" y2="162" stroke="#334155" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="398" y="152" text-anchor="middle" font-size="10" fill="#475569">chama</text>
  <line x1="600" y1="162" x2="636" y2="162" stroke="#334155" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="618" y="152" text-anchor="middle" font-size="10" fill="#475569">usa</text>

  <!-- Infra implementa portas (tracejada, aponta para dentro) -->
  <line x1="740" y1="296" x2="740" y2="256" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#seta-tracejada)"/>
  <text x="756" y="280" font-size="10" fill="#92400e">implementa as portas</text>

  <!-- Infra -> Mongo -->
  <line x1="416" y1="376" x2="172" y2="382" stroke="#334155" stroke-width="1.6" marker-end="url(#seta)"/>
  <text x="295" y="368" text-anchor="middle" font-size="10" fill="#475569">driver (maxTimeMS, pool único)</text>

  <!-- Verificação -->
  <text x="480" y="530" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="Consolas, monospace">grep -r "mongoose|bcrypt|express" src/domain src/application  →  0 ocorrências</text>
</svg>
